<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.0.dtd"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   width="900"
   height="600"
   viewBox="0 0 900 600"
   version="1.1"
   id="rootSvg"
   sodipodi:docname="app-object-drag.svg"
   inkscape:version="1.0">
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="1.0"
     inkscape:pageopacity="0.0"
     inkscape:pageshadow="2"
     inkscape:document-units="px"
     inkscape:document-rotation="0"
     inkscape:snap-global="false"
     showgrid="false" />
  <rect x="0" y="0" width="900" height="600" fill="#ffffff" id="background" />
  <rect x="40" y="420" width="400" height="140" fill="#204080" id="dragTarget" />
  <rect x="800" y="500" width="40" height="20" fill="#b03030" id="tinyControl" />
</svg>
