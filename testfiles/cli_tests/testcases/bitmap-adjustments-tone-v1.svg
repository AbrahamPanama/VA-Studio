<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="32" height="32" viewBox="0 0 2 2">
  <defs>
    <filter id="tone" x="0" y="0" width="1" height="1"
            color-interpolation-filters="sRGB">
      <feComponentTransfer inkscape:bitmap-adjustment="tone-v1"
                           inkscape:brightness="40"
                           inkscape:contrast="0"
                           inkscape:intensity="0"
                           inkscape:highlights="0"
                           inkscape:shadows="0"
                           inkscape:midtones="0">
        <feFuncR type="table" tableValues="0.1 0.9"/>
        <feFuncG type="table" tableValues="0.1 0.9"/>
        <feFuncB type="table" tableValues="0.1 0.9"/>
        <feFuncA type="identity"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <image width="2" height="2" preserveAspectRatio="none"
         style="image-rendering:pixelated;filter:url(#tone)"
         href="data:image/png;base64,"/>
</svg>
