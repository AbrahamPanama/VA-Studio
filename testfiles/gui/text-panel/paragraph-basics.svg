<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#ffffff"/>
  <text id="paragraph-test" x="60" y="100"
        style="font-family:sans-serif;font-size:32px;line-height:125%;fill:#202020">
    <tspan x="60" y="100" sodipodi:role="paragraph">First paragraph for start alignment.</tspan>
    <tspan x="60" y="165" sodipodi:role="paragraph">Second paragraph for caret targeting.</tspan>
    <tspan x="60" y="230" sodipodi:role="paragraph">Third paragraph for multi-selection.</tspan>
  </text>
  <text id="vertical-test" x="650" y="80"
        style="font-family:sans-serif;font-size:28px;writing-mode:vertical-rl;fill:#205080">Vertical 文本</text>
</svg>
